<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1">
<title>GALAXY MIND RUSH · Galaxy Edition</title>
<link href="https://fonts.googleapis.com/css2?family=Kanit:wght@300;400;600;800&display=swap" rel="stylesheet">
<script>
/* v6: โหลด PeerJS แบบมีสำรองหลาย CDN — ถ้าแหล่งแรกโดนบล็อกจะลองแหล่งถัดไปอัตโนมัติ */
window.PEER_CDNS=['https://unpkg.com/peerjs@1.5.4/dist/peerjs.min.js','https://cdn.jsdelivr.net/npm/peerjs@1.5.4/dist/peerjs.min.js','https://cdnjs.cloudflare.com/ajax/libs/peerjs/1.5.4/peerjs.min.js'];
window.PEER_READY=new Promise(res=>{let i=0;const next=()=>{if(window.Peer)return res(true);if(i>=PEER_CDNS.length)return res(false);const s=document.createElement('script');s.src=PEER_CDNS[i++];s.onload=()=>res(!!window.Peer);s.onerror=next;document.head.appendChild(s)};next()});
</script>
<style>
:root{--card:rgba(24,16,58,.62);--line:rgba(196,181,253,.3);--txt:#f5f3ff;--mut:#c4b5fd;--a:#7c3aed;--b:#ec4899;--o0:#e11d74;--o1:#2563eb;--o2:#f59e0b;--o3:#0d9488}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:'Kanit',system-ui,sans-serif;color:var(--txt);background:#05031a;overflow-x:hidden;min-height:100vh}
body::before{content:"";position:fixed;inset:0;z-index:-2;background:radial-gradient(900px 600px at 8% 12%,rgba(124,58,237,.55) 0%,transparent 60%),radial-gradient(800px 560px at 95% 20%,rgba(14,165,233,.35) 0%,transparent 60%),radial-gradient(900px 600px at 70% 110%,rgba(236,72,153,.45) 0%,transparent 60%),radial-gradient(600px 400px at 20% 95%,rgba(34,197,94,.18) 0%,transparent 60%),linear-gradient(180deg,#05031a 0%,#0d0730 55%,#1a0833 100%)}
body::after{content:"";position:fixed;inset:0;z-index:-1;background-image:radial-gradient(1px 1px at 20px 30px,#fff,transparent),radial-gradient(1px 1px at 120px 80px,#cfe,transparent),radial-gradient(1.5px 1.5px at 200px 150px,#fff,transparent),radial-gradient(1px 1px at 300px 40px,#ddf,transparent),radial-gradient(1px 1px at 380px 200px,#fff,transparent);background-size:420px 260px;opacity:.55;animation:drift 120s linear infinite}
@keyframes drift{to{background-position:420px 260px}}
button{font:inherit;cursor:pointer}
.btn{border:0;border-radius:999px;padding:12px 24px;font-weight:700;color:#fff;background:linear-gradient(135deg,#7c3aed,#ec4899 55%,#f59e0b);box-shadow:0 0 18px rgba(236,72,153,.45),0 8px 20px rgba(0,0,0,.4);transition:.15s}
.btn:hover{transform:translateY(-2px)}.btn:active{transform:scale(.97)}
.btn.ghost{background:rgba(76,29,149,.35);box-shadow:none;border:1px solid var(--line)}
.btn.sm{padding:8px 14px;font-size:14px;border-radius:10px}
.btn.xl{padding:16px 30px;font-size:24px;width:100%}
.card{background:var(--card);border:1px solid var(--line);border-radius:22px;padding:20px;backdrop-filter:blur(12px)}
.center{min-height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:24px;text-align:center;gap:16px}
.title{font-size:clamp(34px,6vw,72px);font-weight:800;letter-spacing:1px;line-height:1.05}
.title span{background:linear-gradient(90deg,#c4b5fd,#7dd3fc,#f9a8d4,#fde68a,#c4b5fd);-webkit-background-clip:text;background-clip:text;color:transparent}
.sub{color:var(--mut);font-size:16px}
.logo{font-size:64px;display:flex;justify-content:center;animation:float 3s ease-in-out infinite}
@keyframes float{50%{transform:translateY(-10px)}}
.roles{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:16px;width:min(640px,100%)}
.role{background:var(--card);border:1px solid var(--line);border-radius:20px;padding:24px;color:var(--txt);display:flex;flex-direction:column;gap:6px;align-items:center;transition:.2s}
.role:hover{border-color:var(--b);transform:translateY(-4px)}
.role .ic{font-size:44px}.role b{font-size:20px}.role small{color:var(--mut)}
.rules{max-width:680px;color:var(--mut);font-size:14px;line-height:1.75;text-align:left}
.rules b{color:var(--txt)}
input.code-in{font:inherit;font-size:40px;letter-spacing:12px;text-align:center;width:240px;padding:10px;border-radius:16px;border:2px solid var(--line);background:rgba(0,0,0,.3);color:#fff}
.err{color:#fca5a5;min-height:22px}
.auto{display:flex;align-items:center;gap:6px;font-size:14px;color:var(--mut);cursor:pointer}
/* HOST */
.host{min-height:100vh;display:flex;flex-direction:column;padding:16px 24px;gap:16px}
.hbar{display:flex;align-items:center;gap:12px;flex-wrap:wrap}
.brand{font-weight:800;font-size:20px;margin-right:auto}.brand b{background:linear-gradient(90deg,#c4b5fd,#7dd3fc,#f9a8d4,#c4b5fd);-webkit-background-clip:text;background-clip:text;color:transparent}
.pill{background:var(--card);border:1px solid var(--line);border-radius:999px;padding:6px 16px;font-size:16px}
.pill b{font-size:20px}
.gt{font-size:24px;font-weight:800;font-variant-numeric:tabular-nums}
.gt.warn{color:#fca5a5;border-color:#ef4444;animation:pulse 1s infinite}
@keyframes pulse{50%{opacity:.55}}
.lob{display:grid;grid-template-columns:minmax(300px,1fr) 1.5fr;gap:16px}
.joinbox{text-align:center;display:flex;flex-direction:column;align-items:center;gap:8px}
.bigcode{font-size:96px;font-weight:800;letter-spacing:14px;line-height:1;background:linear-gradient(90deg,#c4b5fd,#7dd3fc,#f9a8d4);-webkit-background-clip:text;background-clip:text;color:transparent}
.qr{width:170px;height:170px;border-radius:12px;background:#fff;padding:8px}
.url{font-size:13px;color:var(--mut);word-break:break-all}
.lobinfo{display:flex;flex-direction:column;gap:12px}
.count{font-size:64px;font-weight:800;line-height:1}
.teams5{display:grid;grid-template-columns:repeat(5,1fr);gap:12px}
.tcol{border-radius:16px;border:1px solid var(--line);background:linear-gradient(180deg,color-mix(in srgb,var(--tc) 22%,transparent),rgba(255,255,255,.03));padding:10px;display:flex;flex-direction:column;gap:6px}
.th{font-weight:800;color:var(--tc);display:flex;justify-content:space-between;font-size:15px}
.chip{padding:6px 10px;border-radius:10px;background:rgba(255,255,255,.04);border:1px dashed var(--line);opacity:.4;font-weight:600;font-size:15px;display:flex;flex-direction:column;transition:.3s}
.chip small{font-weight:300;font-size:11px;color:var(--mut)}
.chip.on{opacity:1;border:1px solid var(--tc);background:color-mix(in srgb,var(--tc) 25%,transparent);box-shadow:0 0 14px color-mix(in srgb,var(--tc) 50%,transparent);animation:pop .4s}
.chip.bot{opacity:.8;border-style:solid}
.chip.off{opacity:.7;border-color:#f87171}
@keyframes pop{0%{transform:scale(.8)}70%{transform:scale(1.06)}}
.qwrap{flex:1;display:flex;flex-direction:column;gap:18px}
.qmeta{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.cat{background:rgba(124,58,237,.35);border:1px solid #c4b5fd;padding:4px 14px;border-radius:999px;font-size:15px}
.dbl{background:linear-gradient(90deg,#f59e0b,#ef4444);padding:4px 14px;border-radius:999px;font-weight:800;animation:pulse 1s infinite}
.qrow{display:flex;gap:24px;align-items:center}
.qtext{flex:1;font-size:clamp(26px,3.3vw,46px);font-weight:600;line-height:1.3}
.ring{position:relative;width:150px;height:150px;flex:none}
.ring svg{width:100%;height:100%;transform:rotate(-90deg)}
.rbg{fill:none;stroke:rgba(255,255,255,.1);stroke-width:10}
.rfg{fill:none;stroke:#7dd3fc;stroke-width:10;stroke-linecap:round;stroke-dasharray:326.7;transition:stroke-dashoffset .25s linear}
.ring .num{position:absolute;inset:0;display:grid;place-items:center;font-size:52px;font-weight:800}
.opts{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.opt{position:relative;overflow:hidden;border-radius:18px;padding:18px 22px;font-size:clamp(20px,2.1vw,30px);font-weight:600;display:flex;align-items:center;gap:16px;min-height:86px;transition:.3s}
.o0{background:var(--o0)}.o1{background:var(--o1)}.o2{background:var(--o2)}.o3{background:var(--o3)}
.sh{font-size:.85em;width:44px;height:44px;display:grid;place-items:center;background:rgba(0,0,0,.22);border-radius:10px;flex:none}
.opt>*{position:relative}
.opt .bar{position:absolute;left:0;bottom:0;height:7px;background:rgba(255,255,255,.85)}
.opt .cnt{margin-left:auto;font-size:.8em}
.opt.dim{opacity:.28;filter:grayscale(.6)}
.opt.correct{box-shadow:0 0 0 4px #fff,0 0 40px rgba(255,255,255,.5);transform:scale(1.02)}
.answered{text-align:center;font-size:22px;color:var(--mut)}
.answered b{color:#fff;font-size:30px}
.fast{display:flex;gap:12px;justify-content:center;flex-wrap:wrap}
.banner{padding:10px 18px;border-radius:14px;background:var(--card);border:1px solid var(--line);font-size:19px}
.explain{text-align:center;color:#f5d0fe;font-size:20px}
.strip{display:grid;grid-template-columns:repeat(5,1fr);gap:10px}
.sitem{border-radius:12px;padding:8px 12px;background:color-mix(in srgb,var(--tc) 18%,transparent);border:1px solid color-mix(in srgb,var(--tc) 60%,transparent);display:flex;justify-content:space-between;gap:6px;font-weight:600;font-size:15px}
.board{display:grid;grid-template-columns:1fr 1fr;gap:16px;flex:1}
.panel h3{margin-bottom:10px;font-size:22px}
.trow{display:grid;grid-template-columns:40px 300px 1fr 90px;gap:10px;align-items:center;margin:12px 0;font-size:19px}
.rk{width:36px;height:36px;border-radius:50%;display:grid;place-items:center;background:rgba(255,255,255,.1);font-weight:800}
.rk.r1{background:linear-gradient(135deg,#fde68a,#f59e0b);color:#000}.rk.r2{background:linear-gradient(135deg,#f1f5f9,#94a3b8);color:#000}.rk.r3{background:linear-gradient(135deg,#fdba74,#c2410c);color:#000}
.tbar{height:22px;background:rgba(255,255,255,.08);border-radius:999px;overflow:hidden}
.tbar i{display:block;height:100%;background:var(--tc);border-radius:999px;transition:width 1s}
.tv{text-align:right;font-weight:800;font-variant-numeric:tabular-nums}
.prow{display:grid;grid-template-columns:40px 1fr auto 90px;gap:10px;align-items:center;padding:5px 8px;border-radius:10px;font-size:18px}
.prow:nth-child(odd){background:rgba(255,255,255,.035)}
.dot{display:inline-block;width:10px;height:10px;border-radius:50%;background:var(--tc);margin-right:8px}
.podium{display:flex;align-items:flex-end;justify-content:center;gap:16px;margin:6px 0}
.pod{width:210px;text-align:center}
.pod .blk{border-radius:16px 16px 0 0;background:color-mix(in srgb,var(--tc) 40%,transparent);border:2px solid var(--tc);display:flex;flex-direction:column;gap:4px;padding:12px;font-weight:800}
.pod.p1 .blk{height:200px}.pod.p2 .blk{height:150px}.pod.p3 .blk{height:115px}
.pod .medal{font-size:46px}
.mvp{display:flex;gap:12px;justify-content:center;flex-wrap:wrap}
/* PLAYER */
.pl{min-height:100vh;display:flex;flex-direction:column;max-width:560px;margin:0 auto;padding:14px;gap:14px}
.ptop{display:flex;align-items:center;gap:10px;padding:10px 14px;border-radius:14px;background:color-mix(in srgb,var(--tc,#7c5cff) 25%,transparent);border:1px solid var(--tc,#7c5cff)}
.ptop .nm{font-weight:800;font-size:18px;margin-right:auto;text-align:left}
.ptop .sc{font-weight:800;font-size:18px}
.tpick{display:grid;gap:10px}
.tbtn{border:2px solid var(--tc);background:color-mix(in srgb,var(--tc) 20%,transparent);color:#fff;border-radius:16px;padding:16px;font-size:20px;font-weight:800;display:flex;justify-content:space-between}
.npick{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.nbtn{border:1px solid var(--tc);background:var(--card);color:#fff;border-radius:14px;padding:14px 10px;display:flex;flex-direction:column;gap:2px}
.nbtn b{font-size:20px}.nbtn small{color:var(--mut);font-size:12px}
.nbtn.taken{opacity:.45}
.pq{font-size:22px;font-weight:600;line-height:1.4;text-align:center;padding:6px}
.pbar{height:10px;border-radius:999px;background:rgba(255,255,255,.1);overflow:hidden}
.pbar i{display:block;height:100%;width:100%;background:linear-gradient(90deg,#7dd3fc,#a855f7,#ec4899);transition:width .2s linear}
.popts{display:grid;gap:10px}
.pbtn{border:0;border-radius:18px;color:#fff;font-size:19px;font-weight:600;padding:16px;display:flex;align-items:center;gap:12px;text-align:left;min-height:70px}
.pbtn:active{transform:scale(.97)}.pbtn:disabled{opacity:.35}
.big-emoji{font-size:84px}
.res-ok{color:#4ade80}.res-bad{color:#f87171}
.stat3{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;width:100%}
.stat3 div{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:10px;text-align:center}
.stat3 b{display:block;font-size:24px}.stat3 small{color:var(--mut)}
.mini{width:100%;text-align:left}
.mini div{display:flex;justify-content:space-between;padding:6px 10px;border-radius:10px;margin:4px 0;background:color-mix(in srgb,var(--tc) 18%,transparent);border:1px solid color-mix(in srgb,var(--tc) 50%,transparent)}
.confetti{position:fixed;inset:0;pointer-events:none;z-index:99;overflow:hidden}
.confetti i{position:absolute;top:-20px;width:10px;height:16px;animation:fall linear forwards}
@keyframes fall{to{transform:translateY(110vh) rotate(720deg)}}
.spinner{width:48px;height:48px;border:4px solid rgba(255,255,255,.15);border-top-color:var(--b);border-radius:50%;animation:spin 1s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.toast{position:fixed;bottom:24px;left:50%;transform:translateX(-50%);background:#3b0764;border:1px solid var(--line);padding:10px 18px;border-radius:12px;z-index:100}
@media(max-width:900px){.lob,.board{grid-template-columns:1fr}.teams5,.strip{grid-template-columns:repeat(2,1fr)}.opts{grid-template-columns:1fr}.qrow{flex-direction:column}.trow{grid-template-columns:36px 1fr 1fr 70px}}
/* ===== MASCOT ANIMATION ===== */
.mz{display:inline-block;vertical-align:middle;flex:none;filter:drop-shadow(0 4px 8px rgba(0,0,0,.5))}
.mz svg{overflow:visible;display:block}
.mz .bd,.mz .wave,.mz .drop,.mz .twk,.mz .aura,.mz .tail,.mz .rays,.mz .pring,.mz .spin,.mz .beam,.mz .orb{transform-box:fill-box}
.mz .bd{transform-origin:50% 100%}
.mz.champ .bd{animation:mzJump .7s ease-in-out infinite}
.mz.happy .bd{animation:mzBounce 1s ease-in-out infinite}
.mz.ok .bd{animation:mzFloat 2.4s ease-in-out infinite}
.mz.worry .bd{animation:mzShake .3s linear infinite}
.mz.sad .bd{animation:mzDroop 2.4s ease-in-out infinite}
.mz.champ .shd{animation:mzShd .7s ease-in-out infinite;transform-box:fill-box;transform-origin:center}
.mz .aura{transform-origin:center;animation:mzAura 1.6s ease-in-out infinite alternate}
.mz .wave{transform-origin:0% 100%;animation:mzWave .45s ease-in-out infinite alternate}
.mz .drop{animation:mzDrip 1.3s ease-in infinite}.mz .drop.d2{animation-delay:.6s}
.mz .twk{transform-origin:center;animation:mzTwk .8s ease-in-out infinite alternate}
.mz .tail{transform-origin:100% 100%;animation:mzTail .5s ease-in-out infinite alternate}
.mz .rays{transform-origin:center;animation:mzSpin 8s linear infinite}
.mz .pring{transform-origin:center;animation:mzPulse 1.6s ease-out infinite}.mz .pring.p2{animation-delay:.8s}
.mz .beam{transform-origin:center;animation:mzBeam 2s linear infinite}
.mz .spin{transform-origin:center;animation:mzSpin 6s linear infinite}
.mz.sad .spin,.mz.sad .rays{animation-duration:16s}
.mz .orb{animation:mzTwk 1s ease-in-out infinite alternate;transform-origin:center}
@keyframes mzJump{0%,100%{transform:translateY(0) scale(1.08,.92)}45%{transform:translateY(-14%) scale(.95,1.05)}}
@keyframes mzShd{50%{transform:scale(.6);opacity:.5}}
@keyframes mzBounce{0%,100%{transform:translateY(0) rotate(-5deg)}50%{transform:translateY(-5%) rotate(5deg)}}
@keyframes mzFloat{0%,100%{transform:translateY(0) rotate(-4deg)}50%{transform:translateY(-4%) rotate(4deg)}}
@keyframes mzShake{0%,100%{transform:translateX(0)}25%{transform:translateX(-2%)}75%{transform:translateX(2%)}}
@keyframes mzDroop{0%,100%{transform:scale(1,1)}50%{transform:scale(1.04,.93)}}
@keyframes mzAura{from{transform:scale(.85);opacity:.55}to{transform:scale(1.08);opacity:1}}
@keyframes mzWave{from{transform:rotate(-18deg)}to{transform:rotate(18deg)}}
@keyframes mzDrip{0%{transform:translateY(0);opacity:1}100%{transform:translateY(60%);opacity:0}}
@keyframes mzTwk{from{transform:scale(.6) rotate(0)}to{transform:scale(1.2) rotate(45deg)}}
@keyframes mzTail{from{transform:scaleX(.9) skewY(-3deg);opacity:.8}to{transform:scaleX(1.08) skewY(3deg);opacity:1}}
@keyframes mzSpin{to{transform:rotate(360deg)}}
@keyframes mzPulse{0%{transform:scale(.85);opacity:.95}100%{transform:scale(1.5);opacity:0}}
@keyframes mzBeam{to{transform:rotate(360deg)}}
.mzrow{display:flex;gap:6px;justify-content:center;align-items:flex-end}
.mood{display:block;font-size:12px;font-weight:600;color:#f5d0fe}
.hname{display:block;font-size:11px;font-weight:600;letter-spacing:2px;color:#c4b5fd;opacity:.95}
/* ===== GALAXY THEME (v6) ===== */
.sky{position:fixed;inset:0;z-index:-1;pointer-events:none;overflow:hidden}
.sky i{position:absolute;border-radius:50%;background:#fff;animation:twinkle var(--d,3s) ease-in-out infinite alternate}
@keyframes twinkle{from{opacity:.15;transform:scale(.6)}to{opacity:1;transform:scale(1.15)}}
.sky .shoot{position:absolute;width:140px;height:2px;border-radius:2px;background:linear-gradient(90deg,#fff,transparent);animation:shoot 7s linear infinite;opacity:0}
@keyframes shoot{0%{transform:translate(0,0) rotate(-25deg);opacity:0}3%{opacity:1}12%{transform:translate(-520px,240px) rotate(-25deg);opacity:0}100%{opacity:0}}
.planet{position:fixed;border-radius:50%;z-index:-1;pointer-events:none;animation:planetF 16s ease-in-out infinite alternate}
@keyframes planetF{to{transform:translate(30px,-36px)}}
.title{text-transform:uppercase;letter-spacing:4px;text-shadow:0 0 18px rgba(168,85,247,.7),0 0 40px rgba(56,189,248,.35)}
.title span,.brand b,.bigcode{text-shadow:none;filter:drop-shadow(0 0 10px rgba(236,72,153,.55))}
.title span,.brand b{animation:shine 5s linear infinite;background-size:200% auto}
@keyframes shine{to{background-position:200% center}}
.tag{display:inline-block;font-weight:600;letter-spacing:4px;font-size:clamp(13px,1.8vw,18px);padding:6px 20px;border-radius:999px;border:1px solid rgba(196,181,253,.6);color:#e9d5ff;background:linear-gradient(90deg,rgba(76,29,149,.55),rgba(14,116,144,.45),rgba(131,24,67,.55));box-shadow:0 0 20px rgba(168,85,247,.35)}
.card{box-shadow:0 0 0 1px rgba(196,181,253,.12),0 0 30px rgba(124,58,237,.25),0 12px 30px rgba(0,0,0,.45)}
.btn:hover{transform:translateY(-3px) scale(1.03);box-shadow:0 0 28px rgba(236,72,153,.6)}
.role:hover{transform:translateY(-6px);box-shadow:0 0 0 2px #a78bfa,0 0 36px rgba(168,85,247,.5)}
.opt,.pbtn{box-shadow:inset 0 -5px 0 rgba(0,0,0,.22),0 0 18px rgba(0,0,0,.3);border:1px solid rgba(255,255,255,.22)}
.pbtn:active{box-shadow:inset 0 -2px 0 rgba(0,0,0,.22)}
.sitem,.tbtn,.mini div,.trow{align-items:center}
.sitem span:first-child,.tbtn span:first-child,.mini div span:first-child,.th span:first-child{display:flex;align-items:center;gap:6px}
.pod .mz{margin-bottom:-6px}
.pill{font-weight:600}
.dbl{background:linear-gradient(90deg,#7c3aed,#ec4899);border:1px solid #f5d0fe}
/* ===== ONLINE (v6/v8) ===== */
.warnbox{font-size:13px;line-height:1.6;padding:8px 12px;border-radius:12px;background:rgba(251,191,36,.1);border:1px solid rgba(251,191,36,.45);color:#fde68a;max-width:380px}
.stage{font-size:14px;color:var(--mut);line-height:1.8}.stage b{color:#fff}
.net{display:inline-flex;align-items:center;gap:6px;font-size:13px;padding:4px 12px;border-radius:999px;border:1px solid var(--line);background:rgba(0,0,0,.25)}
.net i{width:9px;height:9px;border-radius:50%;background:#facc15;box-shadow:0 0 8px #facc15}
.net.ok i{background:#4ade80;box-shadow:0 0 8px #4ade80}.net.bad i{background:#f87171;box-shadow:0 0 8px #f87171;animation:pulse 1s infinite}
.share{display:flex;gap:8px;flex-wrap:wrap;justify-content:center}
.hint{font-size:12px;color:var(--mut);line-height:1.6;max-width:360px}
/* ===== v9 RESPONSIVE — ตัวหนังสือไม่ตกขอบทุกขนาดจอ ===== */
html{-webkit-text-size-adjust:100%}
body{overflow-wrap:anywhere;word-break:normal;line-break:auto}
.host>*,.lob>*,.board>*,.qwrap>*,.qrow>*,.opts>*,.teams5>*,.strip>*,.trow>*,.prow>*,.stat3>*,.npick>*,.tpick>*,.pl>*,.center>*{min-width:0}
.qtext,.pq,.opt,.pbtn,.chip,.nbtn,.tbtn,.sitem,.prow,.trow,.banner,.explain,.rules,.sub,.mood,.hname,.err,.warnbox,.stage,.title,.tag,.cat,.pill{overflow-wrap:anywhere}
.opt>span:nth-child(2),.pbtn{min-width:0}
.opt>span:nth-child(2){flex:1;line-height:1.3}
.pbtn{line-height:1.35;font-size:clamp(16px,4.4vw,19px)}
.qtext{font-size:clamp(22px,3vw,44px)}
.pq{font-size:clamp(18px,5vw,22px)}
.title{font-size:clamp(28px,7vw,72px);max-width:100%}
.title[style*="display:flex"]{flex-wrap:wrap}
.tag{max-width:100%;letter-spacing:clamp(1px,.5vw,4px);font-size:clamp(11px,2.6vw,18px);padding:6px clamp(10px,3vw,20px)}
.bigcode{font-size:clamp(56px,10vw,96px);letter-spacing:clamp(6px,1.5vw,14px)}
input.code-in{width:min(240px,80vw);font-size:clamp(30px,9vw,40px);letter-spacing:clamp(6px,2.5vw,12px)}
.btn.xl{font-size:clamp(18px,4.5vw,24px);padding:14px clamp(14px,4vw,30px)}
.trow{grid-template-columns:40px minmax(0,1.3fr) minmax(0,1fr) 80px}
.sitem>span:first-child{min-width:0;overflow:hidden}
.sitem>span:first-child{white-space:nowrap;text-overflow:ellipsis}
.mzrow{flex-wrap:nowrap;max-width:100%}
.mzrow .mz{width:clamp(46px,16vw,92px)!important;height:auto!important}
.mzrow .mz:nth-child(3){width:clamp(58px,21vw,120px)!important}
.mzrow .mz svg{width:100%;height:auto}
.podium{max-width:100%}
.pod{flex:0 1 210px;min-width:0}
.pod .blk{overflow-wrap:anywhere}
.ring{width:clamp(96px,12vw,150px);height:clamp(96px,12vw,150px)}
.ring .num{font-size:clamp(34px,4.4vw,52px)}
.answered{font-size:clamp(16px,2vw,22px)}
@media(max-width:1100px){.teams5{grid-template-columns:repeat(3,1fr)}.strip{grid-template-columns:repeat(3,1fr)}}
@media(max-width:900px){.qrow{flex-direction:row;align-items:flex-start}.ring{width:96px;height:96px}}
@media(max-width:600px){
 .host{padding:10px 12px;gap:12px}
 .hbar{gap:8px}.brand{font-size:16px;width:100%}.pill{font-size:13px;padding:5px 12px}.pill b{font-size:16px}.gt{font-size:18px}
 .teams5,.strip{grid-template-columns:repeat(2,1fr)}
 .qrow{flex-direction:column;align-items:stretch}.ring{align-self:center}
 .opt{min-height:64px;padding:12px 14px;gap:10px;font-size:17px}.sh{width:34px;height:34px}
 .trow{grid-template-columns:32px minmax(0,1fr) 64px;font-size:16px}.trow .tbar{display:none}
 .prow{grid-template-columns:32px minmax(0,1fr) auto 64px;font-size:15px}
 .podium{gap:6px}.pod.p1 .blk{height:150px}.pod.p2 .blk{height:118px}.pod.p3 .blk{height:96px}.pod .blk{padding:8px 4px;font-size:13px}.pod .blk div[style]{font-size:20px!important}.pod .medal{font-size:30px}
 .pod .mz{width:clamp(48px,22vw,92px)!important;height:auto!important}.pod .mz svg{width:100%;height:auto}
 .title[style*="display:flex"] .mz{width:72px!important;height:72px!important}.title[style*="display:flex"] .mz svg{width:72px;height:72px}
 .banner{font-size:15px;padding:8px 12px}.explain{font-size:16px}
 .roles{grid-template-columns:1fr}.role{padding:18px}
 .rules{font-size:13px}
 .stat3 b{font-size:20px}
 .nbtn b{font-size:18px}.tbtn{font-size:17px;padding:12px}
 .big-emoji{font-size:64px}
}
.sitem>span:last-child,.tv,.rk,.pill b,.sc,.count,.gt,.opt .cnt,.prow>div:nth-child(3){white-space:nowrap;overflow-wrap:normal;word-break:keep-all}
.sitem>span:last-child{flex:none}
@media(max-width:600px){.strip{grid-template-columns:1fr}.pod .hname{display:none}.sitem{padding:6px 10px}}
@media(max-width:360px){.npick{grid-template-columns:1fr}.stat3{grid-template-columns:1fr 1fr 1fr;gap:6px}.stat3 div{padding:8px 4px}}
/* ===== v10 ===== */
.lv{background:rgba(255,255,255,.12);border:1px solid var(--line);padding:4px 12px;border-radius:999px;font-size:14px;white-space:nowrap}
.qimg{width:clamp(220px,30vw,440px);max-height:34vh;object-fit:cover;border-radius:18px;border:2px solid rgba(196,181,253,.55);box-shadow:0 0 30px rgba(168,85,247,.45);flex:none}
.qimg.sm{width:clamp(140px,16vw,240px);max-height:20vh}
.pimg{width:100%;max-height:30vh;object-fit:cover;border-radius:16px;border:2px solid rgba(196,181,253,.5);box-shadow:0 0 20px rgba(168,85,247,.4)}
/* หน้าสรุป 5 ทีม — ใช้ min-height แทน height เพื่อไม่ให้ตัวหนังสือล้นกล่อง */
.p5set{gap:12px;align-items:flex-end;flex-wrap:nowrap;width:100%;max-width:1200px}
.p5set .pod{flex:1 1 0;min-width:0;width:auto;display:flex;flex-direction:column;align-items:center}
.p5set .pod .blk{width:100%;height:auto!important;justify-content:flex-start;gap:6px;padding:12px 10px 14px;font-weight:600}
.p5set .pod.p1 .blk{min-height:250px}.p5set .pod.p2 .blk{min-height:215px}.p5set .pod.p3 .blk{min-height:190px}.p5set .pod.p4 .blk{min-height:170px}.p5set .pod.p5 .blk{min-height:160px}
.p5set .pn{font-weight:800;font-size:clamp(13px,1.2vw,17px);line-height:1.25}
.p5set .aw{font-size:clamp(12px,1vw,14px);color:#fde68a;font-weight:700}
.p5set .avg{font-size:clamp(22px,2.2vw,30px);font-weight:800;white-space:nowrap}.p5set .avg small{font-size:12px;font-weight:400;color:var(--mut)}
.p5set .vst{display:flex;flex-direction:column;gap:2px;font-size:clamp(11px,.95vw,13px);font-weight:400;line-height:1.4}
.p5set .vst b{font-weight:800}
.bdgs{display:flex;flex-wrap:wrap;gap:4px;justify-content:center}.bdg{font-size:11px;padding:2px 8px;border-radius:999px;background:rgba(253,230,138,.18);border:1px solid #fde68a;color:#fde68a;white-space:nowrap}
.rkn{display:inline-grid;place-items:center;width:40px;height:40px;border-radius:50%;background:rgba(255,255,255,.14);border:2px solid var(--tc);font-size:20px;font-weight:800}
.p5set .pod .mz{margin-bottom:-6px}
@media(max-width:900px){.qrow{flex-wrap:wrap}.qimg{width:min(100%,420px);order:-1}.qimg.sm{width:min(60%,260px)}}
@media(max-width:760px){
 .p5set{flex-direction:column;align-items:stretch;gap:8px}
 .p5set .pod{order:var(--r);flex:none;width:100%;display:grid;grid-template-columns:30px 52px minmax(0,1fr);align-items:center;gap:6px}
 .p5set .pod .medal{font-size:24px}.p5set .rkn{width:28px;height:28px;font-size:14px;border-width:2px}
 .p5set .pod .mz{width:52px!important;height:52px!important;margin:0}.p5set .pod .mz svg{width:52px;height:52px}
 .p5set .pod .blk{min-height:0!important;border-radius:14px;text-align:left;padding:8px 10px;display:block}
 .p5set .pn{font-size:15px}.p5set .aw{font-size:12px}.p5set .avg{font-size:22px;margin:2px 0}
 .p5set .vst{flex-direction:row;flex-wrap:wrap;column-gap:10px;font-size:12px}.bdgs{justify-content:flex-start;margin-top:3px}
 .p5set .pn,.p5set .aw{overflow-wrap:normal;word-break:normal}
 .p5set .pod .hname{display:none}
}
/* ===== v12 · กรอบรูป 3D “ว้าว” ===== */
.imgfx{position:relative;flex:none;perspective:900px;border-radius:20px;isolation:isolate;animation:imgIn .9s cubic-bezier(.2,1.4,.4,1) both}
.imgfx::before{content:"";position:absolute;inset:-4px;border-radius:22px;z-index:-1;background:conic-gradient(from var(--a,0deg),#7dd3fc,#a855f7,#ec4899,#fde68a,#7dd3fc);animation:ringSpin 4s linear infinite;filter:blur(1px)}
.imgfx::after{content:"";position:absolute;inset:-18px;border-radius:30px;z-index:-2;background:radial-gradient(closest-side,rgba(168,85,247,.55),rgba(236,72,153,.25),transparent);animation:glowP 2.4s ease-in-out infinite alternate}
.imgfx>img{display:block;border:0!important;box-shadow:0 18px 40px rgba(0,0,0,.55)!important;transform-style:preserve-3d;animation:tilt3d 6s ease-in-out infinite;will-change:transform}
.imgfx .shine{position:absolute;inset:0;border-radius:18px;overflow:hidden;pointer-events:none}
.imgfx .shine::before{content:"";position:absolute;top:-20%;left:-60%;width:40%;height:140%;background:linear-gradient(100deg,transparent,rgba(255,255,255,.55),transparent);transform:skewX(-18deg);animation:sweep 3.2s ease-in-out infinite .9s}
.imgfx.p{width:100%}.imgfx.p>img{width:100%}
@property --a{syntax:'<angle>';inherits:false;initial-value:0deg}
@keyframes ringSpin{to{--a:360deg}}
@keyframes imgIn{0%{opacity:0;transform:scale(.55) rotateY(-35deg) rotateX(12deg)}100%{opacity:1;transform:none}}
@keyframes tilt3d{0%,100%{transform:rotateY(-7deg) rotateX(4deg) translateZ(0) scale(1)}50%{transform:rotateY(7deg) rotateX(-3deg) translateZ(20px) scale(1.03)}}
@keyframes glowP{from{opacity:.55;transform:scale(.96)}to{opacity:1;transform:scale(1.04)}}
@keyframes sweep{0%{left:-60%}55%,100%{left:130%}}
@media(prefers-reduced-motion:reduce){.imgfx,.imgfx>img,.imgfx::before,.imgfx .shine::before{animation:none}}
@media(max-width:900px){.qrow>.imgfx{order:-1;width:min(100%,420px)}.qrow>.imgfx>.qimg{width:100%}.qrow>.imgfx.sm{width:min(60%,260px)}}

function confetti(n=120){const box=document.createElement('div');box.className='confetti';const cs=TEAMS.map(t=>t.color).concat(['#fff','#c4b5fd','#fde68a']);for(let i=0;i<n;i++){const s=document.createElement('i');s.style.left=Math.random()*100+'%';s.style.background=cs[i%cs.length];s.style.animationDelay=Math.random()*2+'s';s.style.animationDuration=3+Math.random()*3+'s';box.appendChild(s)}document.body.appendChild(box);setTimeout(()=>box.remove(),9000)}
let AC;function beep(f,d){try{AC=AC||new(window.AudioContext||window.webkitAudioContext)();const o=AC.createOscillator(),g=AC.createGain();o.type='triangle';o.frequency.value=f;g.gain.value=.15;o.connect(g);g.connect(AC.destination);o.start();g.gain.exponentialRampToValueAtTime(.0001,AC.currentTime+d);o.stop(AC.currentTime+d)}catch(e){}}
function sfx(k){const seq={tick:[[880,.07]],tap:[[660,.06]],join:[[523,.08],[784,.1]],reveal:[[523,.1],[659,.1],[784,.2]],start:[[392,.1],[523,.1],[659,.1],[784,.25]],end:[[523,.12],[659,.12],[784,.12],[1047,.35]]}[k]||[];let d=0;seq.forEach(([f,l])=>{setTimeout(()=>beep(f,l),d*1000);d+=l*.9})}

/* ================= NETWORK (PeerJS ออนไลน์ / BroadcastChannel ทดสอบ) ================= */
const Net={
 mode:'online',peer:null,conns:[],conn:null,bc:null,
 hostStart(code,mode,onMsg,onStatus){
  this.mode=mode;
  if(mode==='local'){this.bc=new BroadcastChannel(PREFIX+code);this.bc.onmessage=e=>{if(e.data&&e.data._h)onMsg(e.data)};setTimeout(()=>onStatus('ready'),50);return}
  if(typeof Peer==='undefined'||!Net.iceOk){Promise.all([PEER_READY,ICE_READY]).then(([ok])=>{Net.iceOk=true;ok?this.hostStart(code,mode,onMsg,onStatus):onStatus('error',{type:'nolib'})});return}
  this.peer=new Peer(PREFIX+code,peerOpts());
  this.peer.on('open',()=>onStatus('ready'));
  this.peer.on('error',e=>onStatus('error',e));
  this.peer.on('disconnected',()=>{try{this.peer.reconnect()}catch(e){}});
  this.peer.on('connection',c=>{
   c.on('open',()=>this.conns.push(c));
   c.on('data',d=>{if(d&&typeof d==='object'){d._conn=c;onMsg(d)}});
   const drop=()=>{this.conns=this.conns.filter(x=>x!==c);onMsg({type:'_close',_conn:c})};
   c.on('close',drop);c.on('error',drop);
  });
 },
 broadcast(msg){if(this.mode==='local'){this.bc&&this.bc.postMessage(msg);return}this.conns.forEach(c=>{try{c.open&&c.send(msg)}catch(e){}})},
 reply(m,msg){msg.to=m.cid;if(this.mode==='local')this.broadcast(msg);else if(m._conn){try{m._conn.send(msg)}catch(e){}}},
 join(code,mode,onMsg,onStatus){
  this.destroy();this.mode=mode;
  if(mode==='local'){this.bc=new BroadcastChannel(PREFIX+code);this.bc.onmessage=e=>{if(e.data&&!e.data._h)onMsg(e.data)};setTimeout(()=>onStatus('ready'),50);return}
  if(typeof Peer==='undefined'||!Net.iceOk){Promise.all([PEER_READY,ICE_READY]).then(([ok])=>{Net.iceOk=true;ok?this.join(code,mode,onMsg,onStatus):onStatus('error',{type:'nolib'})});return}
  this.peer=new Peer(peerOpts());
  this.peer.on('open',()=>{
   onStatus('signal');
   this.conn=this.peer.connect(PREFIX+code,{reliable:true,serialization:'json'});
   this.conn.on('open',()=>onStatus('ready'));
   this.conn.on('data',d=>onMsg(d));
   this.conn.on('close',()=>onStatus('closed'));
   this.conn.on('error',e=>onStatus('error',e));
  });
  this.peer.on('error',e=>onStatus('error',e));
 },
 toHost(msg){msg._h=1;if(this.mode==='local'){this.bc&&this.bc.postMessage(msg)}else if(this.conn&&this.conn.open){this.conn.send(msg)}},
 destroy(){try{this.bc&&this.bc.close()}catch(e){}this.bc=null;try{this.peer&&this.peer.destroy()}catch(e){}this.peer=null;this.conn=null;this.conns=[]}
};

/* ================= HOST ================= */
const H={mode:'online',code:'',players:{},phase:'lobby',qi:-1,ans:{},qStart:0,qDur:CFG.Q_SEC*1000,gameStart:0,auto:true,rv:null,t1:null,t2:null,tick:null,lastTick:-1};
const Host={
 setup(){app.innerHTML=`<div class="center"><div class="logo">🖥️</div><h1 class="title">โหมด <span>Host</span></h1><p class="sub">เลือกวิธีเชื่อมต่อผู้เล่น</p>
 <div class="roles"><button class="role" onclick="Host.create('online')"><div class="ic">🌐</div><b>เล่นจริง (ออนไลน์)</b><small>ผู้เล่นใช้มือถือ/โน้ตบุ๊กของตัวเอง ต้องมีอินเทอร์เน็ต</small></button>
 <button class="role" onclick="Host.create('local')"><div class="ic">🧪</div><b>ซ้อม / ทดสอบ</b><small>เปิดหลายแท็บในเครื่องเดียว</small></button></div>
 <button class="btn ghost sm" onclick="renderHome()">← กลับ</button></div>`},
 create(mode){
  H.mode=mode;H.code=String(Math.floor(1000+Math.random()*9000));
  app.innerHTML=`<div class="center"><div class="spinner"></div><p>กำลังสร้างห้อง ${H.code}...</p></div>`;
  Net.destroy();H.ready=false;
  Net.hostStart(H.code,mode,m=>Host.onMsg(m),H.onSt=(st,e)=>{
   if(st==='ready'){H.ready=true;H.rc=0;Host.wake();if(!H.tick)H.tick=setInterval(()=>Host.onTick(),250);if(!H.hb)H.hb=setInterval(()=>Net.broadcast({type:'ping',phase:H.phase,qi:H.qi}),CFG.HEARTBEAT_MS);Host.render();return}
   /* v8: รหัสซ้ำตอน "สร้างห้องครั้งแรก" เท่านั้นที่สุ่มรหัสใหม่ — ถ้าห้องเปิดอยู่แล้วจะเชื่อมกลับด้วยรหัสเดิม ผู้เล่นไม่ต้องเปลี่ยนลิงก์ */
   if(e&&e.type==='unavailable-id'&&!H.ready){Host.create(mode);return}
   if(H.ready){if(!Net.peer||Net.peer.destroyed||(e&&e.type==='unavailable-id'))Host.reconnect();else toast('⚠️ การเชื่อมต่อมีปัญหา: '+(e&&e.type||''));Host.onTick();return}
   app.innerHTML=`<div class="center"><div class="logo">⚠️</div><h2>สร้างห้องออนไลน์ไม่สำเร็จ</h2><p class="sub">${e&&e.type==='nolib'?'โหลดระบบ PeerJS ไม่ได้ (ไม่มีอินเทอร์เน็ต หรือเครือข่ายบล็อก)':'เครือข่ายอาจบล็อก WebRTC ('+(e&&e.type||'')+')'}</p>
   <div style="display:flex;gap:10px"><button class="btn" onclick="Host.create('online')">ลองใหม่</button><button class="btn ghost" onclick="Host.create('local')">ใช้โหมดทดสอบ</button></div></div>`;
  });
 },
 copy(k){const u=Host.joinUrl(),isFile=location.protocol==='file:';
  const txt=k==='link'?(isFile?`รหัสห้อง ${H.code}`:u):`🌌 GALAXY MIND RUSH เริ่มแล้ว!\n${isFile?'เปิดไฟล์เกม → กด “เข้าร่วมเป็นผู้เล่น”':'กดลิงก์: '+u}\nรหัสห้อง: ${H.code} → เลือกทีม → แตะชื่อตัวเอง 🚀`;
  const done=()=>toast('📋 คัดลอกแล้ว');
  if(navigator.clipboard&&window.isSecureContext)navigator.clipboard.writeText(txt).then(done,()=>prompt('คัดลอกข้อความนี้',txt));else prompt('คัดลอกข้อความนี้',txt)},
 reconnect(){ /* v8: เปิดห้องเดิมใหม่ (รหัสเดิม) คะแนนผู้เล่นยังอยู่ */
  if(H.mode!=='online'||H.rcT)return;H.rc=(H.rc||0)+1;toast('📡 กำลังเชื่อมห้อง '+H.code+' กลับ...');
  H.rcT=setTimeout(()=>{H.rcT=null;try{Net.peer&&Net.peer.destroy()}catch(e){}Net.peer=null;Net.conns=[];Net.hostStart(H.code,'online',m=>Host.onMsg(m),H.onSt)},Math.min(2000*H.rc,8000))},
 wake(){ /* v8: กันจอ Host ดับระหว่างเล่น */
  try{if(navigator.wakeLock&&!H.wl)navigator.wakeLock.request('screen').then(l=>{H.wl=l;l.addEventListener('release',()=>H.wl=null)}).catch(()=>{})}catch(e){}},
 joinUrl(){return location.href.split(/[?#]/)[0]+'?room='+H.code+(H.mode==='local'?'&mode=local':'')},
 onMsg(m){
  if(m.type==='hello'){Net.reply(m,Host.state());return}
  if(m.type==='join'){
   const r=ROSTER[m.pid];if(!r)return;
   let p=H.players[m.pid];
   if(!p)p=H.players[m.pid]={...r,score:0,streak:0,correct:0,time:0};
   p.online=true;p.bot=false;p.cid=m.cid;p.conn=m._conn||null;
   Net.reply(m,{type:'joined',pid:m.pid});
   Host.push();
   if(H.phase==='lobby'){Host.render();sfx('join')}else Host.updateCount();
   return;
  }
  if(m.type==='answer'){Host.answer(m.pid,m.qi,m.c,m);return}
  if(m.type==='leave'){const p=H.players[m.pid];if(p&&p.cid===m.cid){if(H.phase==='lobby')delete H.players[m.pid];else p.online=false;Host.push();if(H.phase==='lobby')Host.render()}return}
  if(m.type==='_close'){Object.values(H.players).forEach(p=>{if(p.conn&&p.conn===m._conn)p.online=false});if(H.phase==='lobby')Host.render();else Host.updateCount()}
 },
 isDbl(i){return i>=QUESTIONS.length-CFG.DOUBLE_LAST},
 gameLeft(){return CFG.GAME_MIN*60000-(H.gameStart?Date.now()-H.gameStart:0)},
 active(){return Object.values(H.players).filter(p=>p.online||p.bot)},
 ranked(){return Object.values(H.players).sort((a,b)=>b.score-a.score||b.correct-a.correct||a.time-b.time)},
 teamStats(){
  const arr=TEAMS.map(t=>{const ms=Object.values(H.players).filter(p=>p.team===t.id);const sum=ms.reduce((s,p)=>s+p.score,0);return{...t,n:ms.length,sum,avg:ms.length?Math.round(sum/ms.length):0}});
  arr.sort((a,b)=>b.avg-a.avg||b.sum-a.sum);arr.forEach((t,i)=>t.rank=i+1);const any=arr.some(t=>t.sum>0);arr.forEach(t=>t.mood=moodOf(t.rank,any));return arr;
 },
 state(){
  const s={type:'state',phase:H.phase,qi:H.qi,total:QUESTIONS.length,gameLeft:Host.gameLeft(),taken:Host.active().map(p=>p.pid),n:Host.active().length};
  if(H.phase==='question'){const q=QUESTIONS[H.qi];s.q={cat:q.cat,q:q.q,o:q.o,dbl:Host.isDbl(H.qi),img:q.img||'',t:q.t||CFG.Q_SEC};s.qDur=H.qDur;s.qLeft=Math.max(0,H.qDur-(Date.now()-H.qStart))}
  if(H.phase!=='lobby'){const rk={};Host.ranked().forEach((p,i)=>rk[p.pid]=[i+1,p.score,p.streak,p.correct]);s.ranks=rk;s.teams=Host.teamStats().map(t=>({id:t.id,avg:t.avg,rank:t.rank,mood:t.mood}))}
  if(H.rv&&H.phase!=='question'&&H.phase!=='lobby'){s.rv={qi:H.rv.qi,a:H.rv.a,o:QUESTIONS[H.rv.qi].o,e:H.rv.e,res:H.rv.res}}
  return s;
 },
 push(){Net.broadcast(Host.state())},
 startGame(){
  if(H.phase!=='lobby')return;
  if(!Host.active().length){toast('ยังไม่มีผู้เล่นเข้าห้อง');return}
  H.gameStart=Date.now();sfx('start');Host.nextQ();
 },
 nextQ(){
  clearTimeout(H.t1);clearTimeout(H.t2);
  if(H.qi+1>=QUESTIONS.length||Host.gameLeft()<=0)return Host.end();
  H.qi++;H.phase='question';H.ans={};H.qStart=Date.now();H.qDur=(QUESTIONS[H.qi].t||CFG.Q_SEC)*1000;H.rv=null;H.lastTick=-1;
  Host.push();Host.render();Host.runBots();
  H.t1=setTimeout(()=>Host.reveal(),H.qDur+250);
 },
 runBots(){const q=QUESTIONS[H.qi],qi=H.qi;Object.values(H.players).filter(p=>p.bot).forEach(p=>{const c=Math.random()<.6?q.a:Math.floor(Math.random()*4);setTimeout(()=>Host.answer(p.pid,qi,c,null),1200+Math.random()*Math.max(1000,H.qDur-2500))})},
 answer(pid,qi,c,m){
  if(H.phase!=='question'||qi!==H.qi||!H.players[pid]||H.ans[pid]||c<0||c>3)return;
  const t=Date.now()-H.qStart;if(t>H.qDur+400)return;
  H.ans[pid]={c,t:Math.min(t,H.qDur)};
  if(m)Net.reply(m,{type:'ack',qi,t});
  Host.updateCount();
  if(Host.active().every(p=>H.ans[p.pid])){clearTimeout(H.t1);H.t1=setTimeout(()=>Host.reveal(),800)}
 },
 updateCount(){const a=document.getElementById('ansCount');if(a)a.textContent=Object.keys(H.ans).length;const b=document.getElementById('actCount');if(b)b.textContent=Host.active().length},
 reveal(){
  if(H.phase!=='question')return;clearTimeout(H.t1);
  H.phase='reveal';const q=QUESTIONS[H.qi],mult=Host.isDbl(H.qi)?2:1;
  const dist=[0,0,0,0],res={};let fast=null,nOk=0;
  Object.values(H.players).forEach(p=>{
   const a=H.ans[p.pid];let ok=false,pts=0;
   if(a){dist[a.c]++;ok=a.c===q.a}
   if(ok){nOk++;p.streak++;p.correct++;p.time+=a.t;const sp=Math.max(0,1-a.t/H.qDur);pts=Math.round((500+500*sp)*mult)+Math.min(p.streak-1,5)*50;if(!fast||a.t<fast.t)fast={pid:p.pid,t:a.t}}
   else p.streak=0;
   p.score+=pts;res[p.pid]={ok,pts,ans:a?a.c:-1};
  });
  H.rv={qi:H.qi,a:q.a,dist,fast,res,e:q.e||'',nAns:Object.keys(H.ans).length,nOk};
  Host.push();Host.render();sfx('reveal');
  if(H.auto)H.t2=setTimeout(()=>Host.board(),CFG.REVEAL_SEC*1000);
 },
 board(){clearTimeout(H.t2);H.phase='board';Host.push();Host.render();if(H.auto)H.t2=setTimeout(()=>Host.nextQ(),CFG.BOARD_SEC*1000)},
 next(){({lobby:Host.startGame,question:Host.reveal,reveal:Host.board,board:Host.nextQ}[H.phase]||(()=>{}))()},
 setAuto(v){H.auto=v;clearTimeout(H.t2);if(v){if(H.phase==='reveal')H.t2=setTimeout(()=>Host.board(),3000);else if(H.phase==='board')H.t2=setTimeout(()=>Host.nextQ(),3000)}},
 end(){clearTimeout(H.t1);clearTimeout(H.t2);H.phase='end';Host.push();Host.render();sfx('end');confetti(180)},
 confirmEnd(){if(confirm('จบเกมตอนนี้และประกาศผลเลยไหม?'))Host.end()},
 reset(){if(!confirm('เริ่มรอบใหม่? คะแนนทั้งหมดจะถูกล้าง (ผู้เล่นยังอยู่ในห้อง)'))return;Object.values(H.players).forEach(p=>{p.score=0;p.streak=0;p.correct=0;p.time=0});H.phase='lobby';H.qi=-1;H.gameStart=0;H.rv=null;H.ans={};Host.push();Host.render()},
 addBots(){let n=0;Object.values(ROSTER).forEach(r=>{if(!H.players[r.pid]){H.players[r.pid]={...r,score:0,streak:0,correct:0,time:0,bot:true,online:false};n++}});toast(`เติมบอทซ้อม ${n} ตัว`);Host.push();Host.render()},
 removeBots(){Object.values(H.players).forEach(p=>{if(p.bot)delete H.players[p.pid]});Host.push();Host.render()},
 onTick(){
  const nn=document.getElementById('netN');if(nn){nn.textContent=Net.conns.length;const np=document.getElementById('netPill');np.className='net '+(Net.peer&&!Net.peer.disconnected?'ok':'bad')}

  if(g){const left=Host.gameLeft();g.textContent='⏱ '+fmt(left);g.classList.toggle('warn',!!H.gameStart&&left<60000&&H.phase!=='end')}
  if(H.phase==='question'){
   const left=Math.max(0,H.qDur-(Date.now()-H.qStart)),sec=Math.ceil(left/1000);

   const r=document.getElementById('ringFg');if(r){r.style.strokeDashoffset=326.7*(1-left/H.qDur);r.style.stroke=left<5000?'#f472b6':'#7dd3fc'}
   if(sec<=5&&sec>0&&sec!==H.lastTick){H.lastTick=sec;sfx('tick')}
  }
 },
 render(){const v={lobby:Host.vLobby,question:Host.vQuestion,reveal:Host.vReveal,board:Host.vBoard,end:Host.vEnd}[H.phase];app.innerHTML=`<div class="host">${Host.vBar()}${v()}</div>`;Host.onTick()},
 vBar(){return `<div class="hbar"><div class="brand">🌌 GALAXY <b>MIND RUSH</b></div>
  <div class="pill">ห้อง <b>${H.code}</b>${H.mode==='local'?' · 🧪 ทดสอบ':''}</div>${H.mode==='online'?`<span class="net ${Net.peer&&!Net.peer.disconnected?'ok':'bad'}" id="netPill"><i></i>ออนไลน์ <b id="netN">${Net.conns.length}</b> เครื่อง</span>`:''}
  ${H.phase!=='lobby'?`<div class="pill">ข้อ <b>${Math.min(H.qi+1,QUESTIONS.length)}</b>/${QUESTIONS.length}</div>`:''}
  <div class="pill gt" id="gTimer">⏱ ${fmt(Host.gameLeft())}</div>
  ${H.phase!=='end'?`<label class="auto"><input type="checkbox" ${H.auto?'checked':''} onchange="Host.setAuto(this.checked)"> Auto</label>

  ${H.phase!=='lobby'?'<button class="btn sm ghost" onclick="Host.confirmEnd()">จบเกม</button>':''}`:''}</div>`},
 vLobby(){
  const url=Host.joinUrl(),isFile=location.protocol==='file:',joined=Host.active().length;
  return `<div class="lob">
  <div class="card joinbox"><div class="sub">รหัสห้อง</div><div class="bigcode">${H.code}</div>

   ${isFile&&H.mode==='online'?'<div class="url">📎 ให้ผู้เล่นเปิดไฟล์ HTML นี้บนเครื่องตัวเอง → กด “เข้าร่วมเป็นผู้เล่น” → ใส่รหัสห้อง</div><div class="hint">💡 ถ้าอัปโหลดไฟล์ขึ้นเว็บ (เปิดผ่าน https://) จะมี QR + ลิงก์ให้สแกนเข้าห้องได้ทันที</div>':''}

   <div class="tpick">${TEAMS.map(t=>`<button class="tbtn" style="--tc:${t.color}" onclick="Player.team('${t.id}')"><span>${mascot(t.id,'happy',50)}<span>${t.name}<span class="hname">${STAR[t.id].th}</span></span></span><span>${t.members.filter((m,i)=>taken.has(t.id+i)).length}/${t.members.length}</span></button>`).join('')}</div></div>`;return}
  const t=teamOf(P.pickTeam);
  app.innerHTML=`<div class="pl" style="--tc:${t.color}"><div class="ptop">${mascot(t.id,'happy',52)}<div class="nm">${t.name}<span class="hname">${STAR[t.id].th}</span></div><button class="btn ghost sm" onclick="Player.team(null)">เปลี่ยนทีม</button></div>
  <h3 style="text-align:center">แตะชื่อของคุณ</h3>
  <div class="npick">${t.members.map((m,i)=>{const pid=t.id+i,tk=taken.has(pid);return `<button class="nbtn ${tk?'taken':''}" onclick="Player.pick('${pid}',${tk})"><b>${m}</b>${tk?'<small>✅ เข้าห้องแล้ว</small>':''}</button>`}).join('')}</div></div>`;
 },
 render(){
  const s=P.st;if(!s)return;
  if(!P.pid)return Player.vPick();
  const me=ROSTER[P.pid],t=teamOf(me.team),rk=s.ranks&&s.ranks[P.pid],score=rk?rk[1]:0;
  const nP=s.ranks?Object.keys(s.ranks).length:s.n;
  const tr=s.teams?s.teams.find(x=>x.id===me.team):null;
  const top=`<div class="ptop">${mascot(t.id,tr&&tr.mood?tr.mood:'happy',54)}<div class="nm">${me.nick}<small class="sub" style="display:block;font-size:12px;font-weight:300">${t.name}</small></div><div class="sc">${score.toLocaleString()} pt</div></div>`;
  const stat=`<div class="stat3"><div><small>อันดับฉัน</small><b>#${rk?rk[0]:'-'}</b><small>จาก ${nP}</small></div><div><small>คะแนน</small><b>${score.toLocaleString()}</b><small>ถูก ${rk?rk[3]:0} ข้อ</small></div><div><small>ทีม</small><b>#${tr?tr.rank:'-'}</b><small>จาก 5 ทีม</small></div></div>`;
  const mini=()=>`<div class="mini">${(s.teams||[]).map(x=>{const tt=teamOf(x.id);return `<div style="--tc:${tt.color}${x.id===me.team?';font-weight:800':''}"><span>#${x.rank} ${mascot(x.id,x.mood,32)} ${tt.name}</span><span>${x.avg.toLocaleString()}</span></div>`}).join('')}</div>`;
  let body='';
  if(s.phase==='lobby'){
   body=`<div class="center" style="min-height:70vh">${mascot(t.id,'happy',130)}<div class="tag">READY FOR LAUNCH 🚀</div><h2>พร้อมแล้ว ${me.nick}!</h2><p class="sub">รอ Host เริ่มเกม · ตอนนี้มี ${s.n} คนในห้อง</p><div class="card rules">${RULES}</div><button class="btn ghost sm" onclick="Player.leave()">เปลี่ยนชื่อ / ทีม</button></div>`;
  }else if(s.phase==='question'){
   if(P.ansQi===s.qi){
    body=`<div class="pq">${s.q.q}</div><div class="center" style="min-height:50vh"><div class="big-emoji">📨</div><h2>ส่งคำตอบแล้ว!</h2>
    <div class="pbtn o${P.ansC}" style="justify-content:center;width:100%"><span class="sh">${SHAPES[P.ansC]}</span>${s.q.o[P.ansC]}</div>
    <p class="sub">${P.ackT!=null?'⏱ ใช้เวลา '+(P.ackT/1000).toFixed(2)+' วินาที':'กำลังส่ง...'}</p><p class="sub">รอเฉลยบนจอใหญ่ 👀</p></div>`;
   }else{
    body=`<div style="display:flex;justify-content:space-between;align-items:center;gap:8px"><span class="cat">${s.q.cat}</span>${s.q.dbl?'<span class="dbl">x2</span>':''}<b id="pSec" style="font-size:28px">${s.q.t}</b></div>
    <div class="pbar"><i id="pBar"></i></div>${s.q.img&&IMG[s.q.img]?`<div class="imgfx p"><img class="pimg" src="${IMG[s.q.img]}" alt=""><i class="shine"></i></div>`:''}<div class="pq">${s.q.q}</div>
    <div class="popts">${s.q.o.map((o,i)=>`<button class="pbtn o${i}" onclick="Player.answer(${i})"><span class="sh">${SHAPES[i]}</span>${o}</button>`).join('')}</div>
    <div class="sub" style="text-align:center">ข้อ ${s.qi+1}/${s.total}</div>`;
   }
  }else if(s.phase==='reveal'){
   const r=s.rv&&s.rv.res[P.pid],ok=r&&r.ok,none=!r||r.ans<0;
   body=`<div class="center" style="min-height:70vh;gap:12px"><div class="big-emoji">${ok?'🎉':none?'⌛':'💥'}</div>
   <h2 class="${ok?'res-ok':'res-bad'}" style="font-size:36px">${ok?'ถูกต้อง!':none?'ไม่ทันตอบ':'ยังไม่ถูก'}</h2>
   ${ok?`<div style="font-size:40px;font-weight:800">+${r.pts.toLocaleString()}</div>`:''}
   ${rk&&rk[2]>=2?`<div class="banner">🔥 ถูกติดกัน ${rk[2]} ข้อ!</div>`:''}
   <div class="sub">เฉลย: <b style="color:#fff">${SHAPES[s.rv.a]} ${s.rv.o[s.rv.a]}</b></div>${s.rv.e?`<div class="sub">💡 ${s.rv.e}</div>`:''}${stat}</div>`;
  }else if(s.phase==='board'){
   body=`<div class="center" style="min-height:70vh;gap:12px">${mascot(t.id,tr&&tr.mood?tr.mood:'happy',120)}<div class="mood" style="font-size:16px">${STAR[t.id].name} · ${MOOD_TXT[tr&&tr.mood?tr.mood:'happy']}</div><h2>อันดับของคุณ #${rk?rk[0]:'-'}</h2>${stat}${mini()}<p class="sub">เตรียมตัว ข้อต่อไปกำลังมา!</p></div>`;
  }else if(s.phase==='end'){
   const medal=rk&&rk[0]<=3?['🥇','🥈','🥉'][rk[0]-1]:'🏁';
   body=`<div class="center" style="min-height:70vh;gap:12px"><div class="big-emoji">${medal}</div><h2>จบเกม! ขอบคุณที่ร่วมสนุก</h2>${tr&&tr.rank===1?`<div class="banner">🏆 ทีม ${t.name} เป็นแชมป์!</div>`:''}${stat}${mini()}</div>`;
  }
  app.innerHTML=`<div class="pl" style="--tc:${t.color}">${top}${body}</div>`;
  Player.tick();
 },
 tick(){
  const s=P.st;if(!s||s.phase!=='question'||!P.pid)return;
  const left=Math.max(0,P.deadline-Date.now());
  const b=document.getElementById('pBar');if(b)b.style.width=(left/(P.qDur||CFG.Q_SEC*1000)*100)+'%';
  const n=document.getElementById('pSec');if(n)n.textContent=left>0?Math.ceil(left/1000):'⌛ หมดเวลา';
  if(left<=0)document.querySelectorAll('button.pbtn').forEach(x=>x.disabled=true);
 }
};
setInterval(()=>Player.tick(),200);
/* v6: เฝ้าดูการเชื่อมต่อ — ไม่ได้ยินจาก Host นานเกิน STALE_MS จะเชื่อมใหม่เอง (คะแนนไม่หาย) */
setInterval(()=>{if(P.st&&P.mode==='online'&&P.last&&Date.now()-P.last>CFG.STALE_MS){P.last=Date.now();Player.lost()}},2000);
document.addEventListener('visibilitychange',()=>{if(!document.hidden&&P.st&&P.mode==='online'){if(Net.conn&&Net.conn.open)Net.toHost({type:'hello',cid:P.cid});else Player.lost()}});

/* ================= INIT ================= */
if(qs.get('room'))Player.start(true);else renderHome();
</script>
</body>
</html>
