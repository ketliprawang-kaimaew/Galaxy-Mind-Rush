<script>
/* v6: โหลด PeerJS แบบมีสำรองหลาย CDN — ถ้าแหล่งแรกโดนบล็อกจะลองแหล่งถัดไปอัตโนมัติ */
window.PEER_CDNS=['https://unpkg.com/peerjs@1.5.4/dist/peerjs.min.js','https://cdn.jsdelivr.net/npm/peerjs@1.5.4/dist/peerjs.min.js','https://cdnjs.cloudflare.com/ajax/libs/peerjs/1.5.4/peerjs.min.js'];
window.PEER_READY=new Promise(res=>{let i=0;const next=()=>{if(window.Peer)return res(true);if(i>=PEER_CDNS.length)return res(false);const s=document.createElement('script');s.src=PEER_CDNS[i++];s.onload=()=>res(!!window.Peer);s.onerror=next;document.head.appendChild(s)};next()});
</script>
<style>

body::after{content:"";position:fixed;inset:0;z-index:-1;background-image:radial-gradient(1px 1px at 20px 30px,#fff,transparent),radial-gradient(1px 1px at 120px 80px,#cfe,transparent),radial-gradient(1.5px 1.5px at 200px 150px,#fff,transparent),radial-gradient(1px 1px at 300px 40px,#ddf,transparent),radial-gradient(1px 1px at 380px 200px,#fff,transparent);background-size:420px 260px;opacity:.55;animation:drift 120s linear infinite}

.card{background:var(--card);border:1px solid var(--line);border-radius:22px;padding:20px;backdrop-filter:blur(12px)}
.center{min-height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:24px;text-align:center;gap:16px}
.title{font-size:clamp(34px,6vw,72px);font-weight:800;letter-spacing:1px;line-height:1.05}

.logo{font-size:64px;display:flex;justify-content:center;animation:float 3s ease-in-out infinite}

.rules{max-width:680px;color:var(--mut);font-size:14px;line-height:1.75;text-align:left}
.rules b{color:var(--txt)}
input.code-in{font:inherit;font-size:40px;letter-spacing:12px;text-align:center;width:240px;padding:10px;border-radius:16px;border:2px solid var(--line);background:rgba(0,0,0,.3);color:#fff}

.auto{display:flex;align-items:center;gap:6px;font-size:14px;color:var(--mut);cursor:pointer}

.host{min-height:100vh;display:flex;flex-direction:column;padding:16px 24px;gap:16px}
.hbar{display:flex;align-items:center;gap:12px;flex-wrap:wrap}
.brand{font-weight:800;font-size:20px;margin-right:auto}.brand b{background:linear-gradient(90deg,#c4b5fd,#7dd3fc,#f9a8d4,#c4b5fd);-webkit-background-clip:text;background-clip:text;color:transparent}

.url{font-size:13px;color:var(--mut);word-break:break-all}
.lobinfo{display:flex;flex-direction:column;gap:12px}

.teams5{display:grid;grid-template-columns:repeat(5,1fr);gap:12px}
.tcol{border-radius:16px;border:1px solid var(--line);background:linear-gradient(180deg,color-mix(in srgb,var(--tc) 22%,transparent),rgba(255,255,255,.03));padding:10px;display:flex;flex-direction:column;gap:6px}

.o0{background:var(--o0)}.o1{background:var(--o1)}.o2{background:var(--o2)}.o3{background:var(--o3)}

.pq{font-size:22px;font-weight:600;line-height:1.4;text-align:center;padding:6px}

/* ===== MASCOT ANIMATION ===== */
.mz{display:inline-block;vertical-align:middle;flex:none;filter:drop-shadow(0 4px 8px rgba(0,0,0,.5))}
.mz svg{overflow:visible;display:block}
.mz .bd,.mz .wave,.mz .drop,.mz .twk,.mz .aura,.mz .tail,.mz .rays,.mz .pring,.mz .spin,.mz .beam,.mz .orb{transform-box:fill-box}
.mz .bd{transform-origin:50% 100%}
.mz.champ .bd{animation:mzJump .7s ease-in-out infinite}
.mz.happy .bd{animation:mzBounce 1s ease-in-out infinite}
.mz.ok .bd{animation:mzFloat 2.4s ease-in-out infinite}
.mz.worry .bd{animation:mzShake .3s linear infinite}
.mz.sad .bd{animation:mzDroop 2.4s ease-in-out infinite}
.mz.champ .shd{animation:mzShd .7s ease-in-out infinite;transform-box:fill-box;transform-origin:center}
.mz .aura{transform-origin:center;animation:mzAura 1.6s ease-in-out infinite alternate}
.mz .wave{transform-origin:0% 100%;animation:mzWave .45s ease-in-out infinite alternate}
.mz .drop{animation:mzDrip 1.3s ease-in infinite}.mz .drop.d2{animation-delay:.6s}
.mz .twk{transform-origin:center;animation:mzTwk .8s ease-in-out infinite alternate}
.mz .tail{transform-origin:100% 100%;animation:mzTail .5s ease-in-out infinite alternate}
.mz .rays{transform-origin:center;animation:mzSpin 8s linear infinite}
.mz .pring{transform-origin:center;animation:mzPulse 1.6s ease-out infinite}.mz .pring.p2{animation-delay:.8s}
.mz .beam{transform-origin:center;animation:mzBeam 2s linear infinite}
.mz .spin{transform-origin:center;animation:mzSpin 6s linear infinite}
.mz.sad .spin,.mz.sad .rays{animation-duration:16s}
.mz .orb{animation:mzTwk 1s ease-in-out infinite alternate;transform-origin:center}
@keyframes mzJump{0%,100%{transform:translateY(0) scale(1.08,.92)}45%{transform:translateY(-14%) scale(.95,1.05)}}
@keyframes mzShd{50%{transform:scale(.6);opacity:.5}}
@keyframes mzBounce{0%,100%{transform:translateY(0) rotate(-5deg)}50%{transform:translateY(-5%) rotate(5deg)}}
@keyframes mzFloat{0%,100%{transform:translateY(0) rotate(-4deg)}50%{transform:translateY(-4%) rotate(4deg)}}
@keyframes mzShake{0%,100%{transform:translateX(0)}25%{transform:translateX(-2%)}75%{transform:translateX(2%)}}
@keyframes mzDroop{0%,100%{transform:scale(1,1)}50%{transform:scale(1.04,.93)}}
@keyframes mzAura{from{transform:scale(.85);opacity:.55}to{transform:scale(1.08);opacity:1}}
@keyframes mzWave{from{transform:rotate(-18deg)}to{transform:rotate(18deg)}}
@keyframes mzDrip{0%{transform:translateY(0);opacity:1}100%{transform:translateY(60%);opacity:0}}
@keyframes mzTwk{from{transform:scale(.6) rotate(0)}to{transform:scale(1.2) rotate(45deg)}}
@keyframes mzTail{from{transform:scaleX(.9) skewY(-3deg);opacity:.8}to{transform:scaleX(1.08) skewY(3deg);opacity:1}}
@keyframes mzSpin{to{transform:rotate(360deg)}}
@keyframes mzPulse{0%{transform:scale(.85);opacity:.95}100%{transform:scale(1.5);opacity:0}}
@keyframes mzBeam{to{transform:rotate(360deg)}}
.mzrow{display:flex;gap:6px;justify-content:center;align-items:flex-end}
.mood{display:block;font-size:12px;font-weight:600;color:#f5d0fe}
.hname{display:block;font-size:11px;font-weight:600;letter-spacing:2px;color:#c4b5fd;opacity:.95}
/* ===== GALAXY THEME (v6) ===== */
.sky{position:fixed;inset:0;z-index:-1;pointer-events:none;overflow:hidden}
.sky i{position:absolute;border-radius:50%;background:#fff;animation:twinkle var(--d,3s) ease-in-out infinite alternate}
@keyframes twinkle{from{opacity:.15;transform:scale(.6)}to{opacity:1;transform:scale(1.15)}}

.title{text-transform:uppercase;letter-spacing:4px;text-shadow:0 0 18px rgba(168,85,247,.7),0 0 40px rgba(56,189,248,.35)}

.card{box-shadow:0 0 0 1px rgba(196,181,253,.12),0 0 30px rgba(124,58,237,.25),0 12px 30px rgba(0,0,0,.45)}
.btn:hover{transform:translateY(-3px) scale(1.03);box-shadow:0 0 28px rgba(236,72,153,.6)}

.pill{font-weight:600}

.net{display:inline-flex;align-items:center;gap:6px;font-size:13px;padding:4px 12px;border-radius:999px;border:1px solid var(--line);background:rgba(0,0,0,.25)}

.share{display:flex;gap:8px;flex-wrap:wrap;justify-content:center}
.hint{font-size:12px;color:var(--mut);line-height:1.6;max-width:360px}

/* ================= NETWORK (PeerJS ออนไลน์ / BroadcastChannel ทดสอบ) ================= */
const Net={
 mode:'online',peer:null,conns:[],conn:null,bc:null,
 hostStart(code,mode,onMsg,onStatus){
  this.mode=mode;
  if(mode==='local'){this.bc=new BroadcastChannel(PREFIX+code);this.bc.onmessage=e=>{if(e.data&&e.data._h)onMsg(e.data)};setTimeout(()=>onStatus('ready'),50);return}
  if(typeof Peer==='undefined'){PEER_READY.then(ok=>ok?this.hostStart(code,mode,onMsg,onStatus):onStatus('error',{type:'nolib'}));return}
  this.peer=new Peer(PREFIX+code,peerOpts());
  this.peer.on('open',()=>onStatus('ready'));
  this.peer.on('error',e=>onStatus('error',e));
  this.peer.on('disconnected',()=>{try{this.peer.reconnect()}catch(e){}});
  this.peer.on('connection',c=>{
   c.on('open',()=>this.conns.push(c));
   c.on('data',d=>{if(d&&typeof d==='object'){d._conn=c;onMsg(d)}});
   const drop=()=>{this.conns=this.conns.filter(x=>x!==c);onMsg({type:'_close',_conn:c})};
   c.on('close',drop);c.on('error',drop);
  });
 },
 broadcast(msg){if(this.mode==='local'){this.bc&&this.bc.postMessage(msg);return}this.conns.forEach(c=>{try{c.open&&c.send(msg)}catch(e){}})},
 reply(m,msg){msg.to=m.cid;if(this.mode==='local')this.broadcast(msg);else if(m._conn){try{m._conn.send(msg)}catch(e){}}},
 join(code,mode,onMsg,onStatus){
  this.destroy();this.mode=mode;
  if(mode==='local'){this.bc=new BroadcastChannel(PREFIX+code);this.bc.onmessage=e=>{if(e.data&&!e.data._h)onMsg(e.data)};setTimeout(()=>onStatus('ready'),50);return}
  if(typeof Peer==='undefined'){PEER_READY.then(ok=>ok?this.join(code,mode,onMsg,onStatus):onStatus('error',{type:'nolib'}));return}
  this.peer=new Peer(peerOpts());
  this.peer.on('open',()=>{
   this.conn=this.peer.connect(PREFIX+code,{reliable:true,serialization:'json'});
   this.conn.on('open',()=>onStatus('ready'));
   this.conn.on('data',d=>onMsg(d));
   this.conn.on('close',()=>onStatus('closed'));
   this.conn.on('error',e=>onStatus('error',e));
  });
  this.peer.on('error',e=>onStatus('error',e));
 },
 toHost(msg){msg._h=1;if(this.mode==='local'){this.bc&&this.bc.postMessage(msg)}else if(this.conn&&this.conn.open){this.conn.send(msg)}},
 destroy(){try{this.bc&&this.bc.close()}catch(e){}this.bc=null;try{this.peer&&this.peer.destroy()}catch(e){}this.peer=null;this.conn=null;this.conns=[]}
};

const H={mode:'online',code:'',players:{},phase:'lobby',qi:-1,ans:{},qStart:0,qDur:CFG.Q_SEC*1000,gameStart:0,auto:true,rv:null,t1:null,t2:null,tick:null,lastTick:-1};
const Host={
 setup(){app.innerHTML=`<div class="center"><div class="logo">🖥️</div><h1 class="title">โหมด <span>Host</span></h1><p class="sub">เลือกวิธีเชื่อมต่อผู้เล่น</p>
 <div class="roles"><button class="role" onclick="Host.create('online')"><div class="ic">🌐</div><b>เล่นจริง (ออนไลน์)</b><small>ผู้เล่นใช้มือถือ/โน้ตบุ๊กของตัวเอง ต้องมีอินเทอร์เน็ต</small></button>
 <button class="role" onclick="Host.create('local')"><div class="ic">🧪</div><b>ซ้อม / ทดสอบ</b><small>เปิดหลายแท็บในเครื่องเดียว</small></button></div>
 <button class="btn ghost sm" onclick="renderHome()">← กลับ</button></div>`},
 create(mode){
  H.mode=mode;H.code=String(Math.floor(1000+Math.random()*9000));
  app.innerHTML=`<div class="center"><div class="spinner"></div><p>กำลังสร้างห้อง ${H.code}...</p></div>`;
  Net.destroy();
  Net.hostStart(H.code,mode,m=>Host.onMsg(m),(st,e)=>{
   if(st==='ready'){if(!H.tick)H.tick=setInterval(()=>Host.onTick(),250);if(!H.hb)H.hb=setInterval(()=>Net.broadcast({type:'ping',phase:H.phase,qi:H.qi}),CFG.HEARTBEAT_MS);Host.render();return}
   if(e&&e.type==='unavailable-id'){Host.create(mode);return}
   if(document.querySelector('.host')){toast('⚠️ การเชื่อมต่อมีปัญหา: '+(e&&e.type||''));return}
   app.innerHTML=`<div class="center"><div class="logo">⚠️</div><h2>สร้างห้องออนไลน์ไม่สำเร็จ</h2><p class="sub">${e&&e.type==='nolib'?'โหลดระบบ PeerJS ไม่ได้ (ไม่มีอินเทอร์เน็ต หรือเครือข่ายบล็อก)':'เครือข่ายอาจบล็อก WebRTC ('+(e&&e.type||'')+')'}</p>
   <div style="display:flex;gap:10px"><button class="btn" onclick="Host.create('online')">ลองใหม่</button><button class="btn ghost" onclick="Host.create('local')">ใช้โหมดทดสอบ</button></div></div>`;
  });
 },
 copy(k){const u=Host.joinUrl(),isFile=location.protocol==='file:';
  const txt=k==='link'?(isFile?`รหัสห้อง ${H.code}`:u):`🌌 GALAXY MIND RUSH เริ่มแล้ว!\n${isFile?'เปิดไฟล์เกม → กด “เข้าร่วมเป็นผู้เล่น”':'กดลิงก์: '+u}\nรหัสห้อง: ${H.code} → เลือกทีม → แตะชื่อตัวเอง 🚀`;
  const done=()=>toast('📋 คัดลอกแล้ว');
  if(navigator.clipboard&&window.isSecureContext)navigator.clipboard.writeText(txt).then(done,()=>prompt('คัดลอกข้อความนี้',txt));else prompt('คัดลอกข้อความนี้',txt)},
 joinUrl(){return location.href.split(/[?#]/)[0]+'?room='+H.code+(H.mode==='local'?'&mode=local':'')},
 onMsg(m){
  if(m.type==='hello'){Net.reply(m,Host.state());return}
  if(m.type==='join'){
   const r=ROSTER[m.pid];if(!r)return;
   let p=H.players[m.pid];
   if(!p)p=H.players[m.pid]={...r,score:0,streak:0,correct:0,time:0};
   p.online=true;p.bot=false;p.cid=m.cid;p.conn=m._conn||null;
   Net.reply(m,{type:'joined',pid:m.pid});
   Host.push();
   if(H.phase==='lobby'){Host.render();sfx('join')}else Host.updateCount();
   return;
  }
  if(m.type==='answer'){Host.answer(m.pid,m.qi,m.c,m);return}
  if(m.type==='leave'){const p=H.players[m.pid];if(p&&p.cid===m.cid){if(H.phase==='lobby')delete H.players[m.pid];else p.online=false;Host.push();if(H.phase==='lobby')Host.render()}return}
  if(m.type==='_close'){Object.values(H.players).forEach(p=>{if(p.conn&&p.conn===m._conn)p.online=false});if(H.phase==='lobby')Host.render();else Host.updateCount()}
 },
 isDbl(i){return i>=QUESTIONS.length-CFG.DOUBLE_LAST},
 gameLeft(){return CFG.GAME_MIN*60000-(H.gameStart?Date.now()-H.gameStart:0)},
 active(){return Object.values(H.players).filter(p=>p.online||p.bot)},
 ranked(){return Object.values(H.players).sort((a,b)=>b.score-a.score||b.correct-a.correct||a.time-b.time)},
 teamStats(){
  const arr=TEAMS.map(t=>{const ms=Object.values(H.players).filter(p=>p.team===t.id);const sum=ms.reduce((s,p)=>s+p.score,0);return{...t,n:ms.length,sum,avg:ms.length?Math.round(sum/ms.length):0}});
  arr.sort((a,b)=>b.avg-a.avg||b.sum-a.sum);arr.forEach((t,i)=>t.rank=i+1);const any=arr.some(t=>t.sum>0);arr.forEach(t=>t.mood=moodOf(t.rank,any));return arr;
 },
 state(){
  const s={type:'state',phase:H.phase,qi:H.qi,total:QUESTIONS.length,gameLeft:Host.gameLeft(),taken:Host.active().map(p=>p.pid),n:Host.active().length};
  if(H.phase==='question'){const q=QUESTIONS[H.qi];s.q={cat:q.cat,q:q.q,o:q.o,dbl:Host.isDbl(H.qi)};s.qLeft=Math.max(0,H.qDur-(Date.now()-H.qStart))}
  if(H.phase!=='lobby'){const rk={};Host.ranked().forEach((p,i)=>rk[p.pid]=[i+1,p.score,p.streak,p.correct]);s.ranks=rk;s.teams=Host.teamStats().map(t=>({id:t.id,avg:t.avg,rank:t.rank,mood:t.mood}))}
  if(H.rv&&H.phase!=='question'&&H.phase!=='lobby'){s.rv={qi:H.rv.qi,a:H.rv.a,o:QUESTIONS[H.rv.qi].o,e:H.rv.e,res:H.rv.res}}
  return s;
 },
 push(){Net.broadcast(Host.state())},
 startGame(){
  if(H.phase!=='lobby')return;
  if(!Host.active().length){toast('ยังไม่มีผู้เล่นเข้าห้อง');return}
  H.gameStart=Date.now();sfx('start');Host.nextQ();
 },
 nextQ(){
  clearTimeout(H.t1);clearTimeout(H.t2);
  if(H.qi+1>=QUESTIONS.length||Host.gameLeft()<=0)return Host.end();
  H.qi++;H.phase='question';H.ans={};H.qStart=Date.now();H.qDur=CFG.Q_SEC*1000;H.rv=null;H.lastTick=-1;

 },

 answer(pid,qi,c,m){

  const t=Date.now()-H.qStart;if(t>H.qDur+400)return;
  H.ans[pid]={c,t:Math.min(t,H.qDur)};
  if(m)Net.reply(m,{type:'ack',qi,t});

 },

  Object.values(H.players).forEach(p=>{
   const a=H.ans[p.pid];let ok=false,pts=0;
   if(a){dist[a.c]++;ok=a.c===q.a}
   if(ok){nOk++;p.streak++;p.correct++;p.time+=a.t;const sp=Math.max(0,1-a.t/H.qDur);pts=Math.round((500+500*sp)*mult)+Math.min(p.streak-1,5)*50;if(!fast||a.t<fast.t)fast={pid:p.pid,t:a.t}}
   else p.streak=0;

  });

const P={cid:ss.get('gmr_cid')||uid(),code:'',mode:'online',pid:null,st:null,pickTeam:null,ansQi:-1,ansC:null,ackT:null,deadline:0,retry:0,to:null};

const Player={
 start(auto){
  P.code=qs.get('room')||ss.get('gmr_code')||'';
  P.mode=qs.get('mode')==='local'?'local':(ss.get('gmr_mode')||'online');
  app.innerHTML=`<div class="center"><div class="logo">🚀</div><h1 class="title">GALAXY <span>MIND RUSH</span></h1>
  <p class="sub">ใส่รหัสห้อง 4 หลักจากจอของ Host</p>
  <input id="codeIn" class="code-in" inputmode="numeric" maxlength="4" value="${P.code}" placeholder="0000">
  <label class="auto"><input type="checkbox" id="localCk" ${P.mode==='local'?'checked':''}> โหมดทดสอบ (แท็บในเครื่องเดียวกัน)</label>
  <button class="btn xl" style="max-width:320px" onclick="Player.connect()">เข้าห้อง ➜</button>
  <div id="pErr" class="err"></div>
  <button class="btn ghost sm" onclick="renderHome()">← กลับ</button></div>`;
  const ci=document.getElementById('codeIn');ci.addEventListener('keydown',e=>{if(e.key==='Enter')Player.connect()});
  if(auto&&qs.get('room')&&/^\d{4}$/.test(P.code))Player.connect();
 },
 err(msg){const e=document.getElementById('pErr');if(e)e.textContent=msg},

 connect(){
  const ci=document.getElementById('codeIn');
  if(ci){P.code=ci.value.trim();P.mode=document.getElementById('localCk').checked?'local':'online'}
  if(!/^\d{4}$/.test(P.code)){Player.err('กรุณาใส่รหัส 4 หลัก');return}
  if(ss.get('gmr_code')!==P.code){ss.del('gmr_pid')}
  ss.set('gmr_code',P.code);ss.set('gmr_mode',P.mode);
  P.pid=ss.get('gmr_pid');P.st=null;
  app.innerHTML=`<div class="center"><div class="spinner"></div><p>กำลังเชื่อมต่อห้อง ${P.code}...</p></div>`;
  clearTimeout(P.to);P.to=setTimeout(()=>{if(!P.st)Player.fail('ไม่พบห้อง '+P.code+' — ตรวจรหัส หรือรอให้ Host เปิดห้องก่อน')},10000);
  Net.join(P.code,P.mode,m=>Player.onMsg(m),(s,e)=>{
   if(s==='ready'){P.retry=0;P.last=Date.now();Net.toHost({type:'hello',cid:P.cid});if(P.pid)Net.toHost({type:'join',cid:P.cid,pid:P.pid});return}
   if(s==='closed'){Player.lost();return}
   if(e&&e.type==='peer-unavailable')Player.fail('ไม่พบห้อง '+P.code+' (Host ยังไม่เปิดห้อง หรือรหัสผิด)');
   else if(e&&e.type==='nolib')Player.fail('โหลดระบบออนไลน์ไม่ได้ — ตรวจอินเทอร์เน็ต');
   else if(P.st)Player.lost();
   else Player.fail('เชื่อมต่อไม่สำเร็จ ('+(e&&e.type||'network')+')');
  });
 },
 lost(){toast('📡 หลุดการเชื่อมต่อ กำลังเชื่อมใหม่...');if(P.retry++<10)setTimeout(()=>Player.connect(),2000);else Player.fail('การเชื่อมต่อขาดหาย กรุณาเข้าห้องใหม่')},
 onMsg(m){
  if(!m||(m.to&&m.to!==P.cid))return;
  P.last=Date.now();
  if(m.type==='ping'){if(!P.st||P.st.phase!==m.phase||P.st.qi!==m.qi)Net.toHost({type:'hello',cid:P.cid});return}
  if(m.type==='state'){
   clearTimeout(P.to);const prev=P.st;P.st=m;
   if(P.pid&&m.phase!=='lobby'&&m.ranks&&!m.ranks[P.pid]&&!(m.taken||[]).includes(P.pid)){P.pid=null;ss.del('gmr_pid')}
   if(m.phase==='question'&&(!prev||prev.phase!=='question'||prev.qi!==m.qi)){P.deadline=Date.now()+m.qLeft;if(P.ansQi!==m.qi){P.ansC=null;P.ackT=null}if(navigator.vibrate)navigator.vibrate(60)}
   if(m.phase==='end'&&(!prev||prev.phase!=='end')&&P.pid)confetti(100);
   if(m.phase==='lobby'&&prev&&prev.phase!=='lobby'){P.ansQi=-1}
   Player.render();return;
  }
  if(m.type==='joined'){P.pid=m.pid;ss.set('gmr_pid',m.pid);Player.render();return}
  if(m.type==='ack'){P.ackT=m.t;if(P.st&&P.st.phase==='question')Player.render()}
 },
 team(id){P.pickTeam=id;Player.render()},
 pick(pid,tk){if(tk&&!confirm('ชื่อนี้เข้าห้องแล้ว ต้องการเข้าแทน (เช่น เปลี่ยนเครื่อง) ใช่ไหม?'))return;Net.toHost({type:'join',cid:P.cid,pid});app.innerHTML=`<div class="center"><div class="spinner"></div><p>กำลังเข้าร่วม...</p></div>`},
 leave(){Net.toHost({type:'leave',cid:P.cid,pid:P.pid});P.pid=null;P.pickTeam=null;ss.del('gmr_pid');Player.render()},
 answer(i){const s=P.st;if(!s||s.phase!=='question'||P.ansQi===s.qi||Date.now()>P.deadline)return;P.ansQi=s.qi;P.ansC=i;P.ackT=null;Net.toHost({type:'answer',cid:P.cid,pid:P.pid,qi:s.qi,c:i});if(navigator.vibrate)navigator.vibrate(30);sfx('tap');Player.render()},
 vPick(){
  const taken=new Set(P.st.taken||[]);
  if(!P.pickTeam){app.innerHTML=`<div class="pl"><h2 style="text-align:center;margin-top:10px">เลือกทีมของคุณ</h2><p class="sub" style="text-align:center">ห้อง ${P.code}</p>
   <div class="tpick">${TEAMS.map(t=>`<button class="tbtn" style="--tc:${t.color}" onclick="Player.team('${t.id}')"><span>${mascot(t.id,'happy',50)}<span>${t.name}<span class="hname">${STAR[t.id].th}</span></span></span><span>${t.members.filter((m,i)=>taken.has(t.id+i)).length}/${t.members.length}</span></button>`).join('')}</div></div>`;return}
  const t=teamOf(P.pickTeam);
  app.innerHTML=`<div class="pl" style="--tc:${t.color}"><div class="ptop">${mascot(t.id,'happy',52)}<div class="nm">${t.name}<span class="hname">${STAR[t.id].th}</span></div><button class="btn ghost sm" onclick="Player.team(null)">เปลี่ยนทีม</button></div>
  <h3 style="text-align:center">แตะชื่อของคุณ</h3>
  <div class="npick">${t.members.map((m,i)=>{const pid=t.id+i,tk=taken.has(pid);return `<button class="nbtn ${tk?'taken':''}" onclick="Player.pick('${pid}',${tk})"><b>${m}</b>${tk?'<small>✅ เข้าห้องแล้ว</small>':''}</button>`}).join('')}</div></div>`;
 },
 render(){
  const s=P.st;if(!s)return;
  if(!P.pid)return Player.vPick();
  const me=ROSTER[P.pid],t=teamOf(me.team),rk=s.ranks&&s.ranks[P.pid],score=rk?rk[1]:0;
  const nP=s.ranks?Object.keys(s.ranks).length:s.n;
  const tr=s.teams?s.teams.find(x=>x.id===me.team):null;
  const top=`<div class="ptop">${mascot(t.id,tr&&tr.mood?tr.mood:'happy',54)}<div class="nm">${me.nick}<small class="sub" style="display:block;font-size:12px;font-weight:300">${t.name}</small></div><div class="sc">${score.toLocaleString()} pt</div></div>`;
  const stat=`<div class="stat3"><div><small>อันดับฉัน</small><b>#${rk?rk[0]:'-'}</b><small>จาก ${nP}</small></div><div><small>คะแนน</small><b>${score.toLocaleString()}</b><small>ถูก ${rk?rk[3]:0} ข้อ</small></div><div><small>ทีม</small><b>#${tr?tr.rank:'-'}</b><small>จาก 5 ทีม</small></div></div>`;
  const mini=()=>`<div class="mini">${(s.teams||[]).map(x=>{const tt=teamOf(x.id);return `<div style="--tc:${tt.color}${x.id===me.team?';font-weight:800':''}"><span>#${x.rank} ${mascot(x.id,x.mood,32)} ${tt.name}</span><span>${x.avg.toLocaleString()}</span></div>`}).join('')}</div>`;
  let body='';
  if(s.phase==='lobby'){
   body=`<div class="center" style="min-height:70vh">${mascot(t.id,'happy',130)}<div class="tag">READY FOR LAUNCH 🚀</div><h2>พร้อมแล้ว ${me.nick}!</h2><p class="sub">รอ Host เริ่มเกม · ตอนนี้มี ${s.n} คนในห้อง</p><div class="card rules">${RULES}</div><button class="btn ghost sm" onclick="Player.leave()">เปลี่ยนชื่อ / ทีม</button></div>`;
  }else if(s.phase==='question'){
   if(P.ansQi===s.qi){
    body=`<div class="pq">${s.q.q}</div><div class="center" style="min-height:50vh"><div class="big-emoji">📨</div><h2>ส่งคำตอบแล้ว!</h2>
    <div class="pbtn o${P.ansC}" style="justify-content:center;width:100%"><span class="sh">${SHAPES[P.ansC]}</span>${s.q.o[P.ansC]}</div>
    <p class="sub">${P.ackT!=null?'⏱ ใช้เวลา '+(P.ackT/1000).toFixed(2)+' วินาที':'กำลังส่ง...'}</p><p class="sub">รอเฉลยบนจอใหญ่ 👀</p></div>`;
   }else{
    body=`<div style="display:flex;justify-content:space-between;align-items:center;gap:8px"><span class="cat">${s.q.cat}</span>${s.q.dbl?'<span class="dbl">x2</span>':''}<b id="pSec" style="font-size:28px">${CFG.Q_SEC}</b></div>
    <div class="pbar"><i id="pBar"></i></div><div class="pq">${s.q.q}</div>
    <div class="popts">${s.q.o.map((o,i)=>`<button class="pbtn o${i}" onclick="Player.answer(${i})"><span class="sh">${SHAPES[i]}</span>${o}</button>`).join('')}</div>
    <div class="sub" style="text-align:center">ข้อ ${s.qi+1}/${s.total}</div>`;
   }
  }else if(s.phase==='reveal'){
   const r=s.rv&&s.rv.res[P.pid],ok=r&&r.ok,none=!r||r.ans<0;
   body=`<div class="center" style="min-height:70vh;gap:12px"><div class="big-emoji">${ok?'🎉':none?'⌛':'💥'}</div>
   <h2 class="${ok?'res-ok':'res-bad'}" style="font-size:36px">${ok?'ถูกต้อง!':none?'ไม่ทันตอบ':'ยังไม่ถูก'}</h2>
   ${ok?`<div style="font-size:40px;font-weight:800">+${r.pts.toLocaleString()}</div>`:''}
   ${rk&&rk[2]>=2?`<div class="banner">🔥 ถูกติดกัน ${rk[2]} ข้อ!</div>`:''}
   <div class="sub">เฉลย: <b style="color:#fff">${SHAPES[s.rv.a]} ${s.rv.o[s.rv.a]}</b></div>${s.rv.e?`<div class="sub">💡 ${s.rv.e}</div>`:''}${stat}</div>`;
  }else if(s.phase==='board'){
   body=`<div class="center" style="min-height:70vh;gap:12px">${mascot(t.id,tr&&tr.mood?tr.mood:'happy',120)}<div class="mood" style="font-size:16px">${STAR[t.id].name} · ${MOOD_TXT[tr&&tr.mood?tr.mood:'happy']}</div><h2>อันดับของคุณ #${rk?rk[0]:'-'}</h2>${stat}${mini()}<p class="sub">เตรียมตัว ข้อต่อไปกำลังมา!</p></div>`;
  }else if(s.phase==='end'){
   const medal=rk&&rk[0]<=3?['🥇','🥈','🥉'][rk[0]-1]:'🏁';
   body=`<div class="center" style="min-height:70vh;gap:12px"><div class="big-emoji">${medal}</div><h2>จบเกม! ขอบคุณที่ร่วมสนุก</h2>${tr&&tr.rank===1?`<div class="banner">🏆 ทีม ${t.name} เป็นแชมป์!</div>`:''}${stat}${mini()}</div>`;
  }
  app.innerHTML=`<div class="pl" style="--tc:${t.color}">${top}${body}</div>`;
  Player.tick();
 },
 tick(){
  const s=P.st;if(!s||s.phase!=='question'||!P.pid)return;
  const left=Math.max(0,P.deadline-Date.now());
  const b=document.getElementById('pBar');if(b)b.style.width=(left/(CFG.Q_SEC*1000)*100)+'%';
  const n=document.getElementById('pSec');if(n)n.textContent=left>0?Math.ceil(left/1000):'⌛ หมดเวลา';
  if(left<=0)document.querySelectorAll('button.pbtn').forEach(x=>x.disabled=true);
 }
};
setInterval(()=>Player.tick(),200);
/* v6: เฝ้าดูการเชื่อมต่อ — ไม่ได้ยินจาก Host นานเกิน STALE_MS จะเชื่อมใหม่เอง (คะแนนไม่หาย) */
setInterval(()=>{if(P.st&&P.mode==='online'&&P.last&&Date.now()-P.last>CFG.STALE_MS){P.last=Date.now();Player.lost()}},2000);
document.addEventListener('visibilitychange',()=>{if(!document.hidden&&P.st&&P.mode==='online'){if(Net.conn&&Net.conn.open)Net.toHost({type:'hello',cid:P.cid});else Player.lost()}});

/* ================= INIT ================= */
if(qs.get('room'))Player.start(true);else renderHome();
</script>
</body>
</html>
